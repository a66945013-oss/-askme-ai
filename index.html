<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AskMe</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, sans-serif;
    background: #111;
    color: #fff;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 16px;
    font-size: 20px;
    font-weight: bold;
    border-bottom: 1px solid #333;
    text-align: center;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .msg {
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 80%;
    line-height: 1.4;
  }
  .user {
    background: #2563eb;
    margin-left: auto;
    text-align: right;
  }
  .bot {
    background: #2a2a2a;
    margin-right: auto;
  }
  #inputArea {
    display: flex;
    padding: 12px;
    border-top: 1px solid #333;
  }
  #userInput {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
  }
  #sendBtn {
    margin-left: 8px;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-weight: bold;
  }
</style>
</head>
<body>

<header>AskMe</header>
<div id="chat"></div>

<div id="inputArea">
  <input type="text" id="userInput" placeholder="अपना सवाल लिखें...">
  <button id="sendBtn">Send</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

function addMessage(text, sender) {
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  input.value = '';
  addMessage('सोच रहा हूँ...', 'bot');

  setTimeout(() => {
    chat.lastChild.remove();
    addMessage('यह एक टस्ट जवाब है। असली AI अगले स्टेप में जुड़ेगा।', 'bot');
  }, 800);
}

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keypress', function(e) {
  if (e.key === 'Enter') sendMessage();
});
</script>

</body>
</html>
